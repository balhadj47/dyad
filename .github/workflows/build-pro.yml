name: Build Dyad for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, example: v1.0.0"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install

      - run: npm run make
        env:
          E2E_TEST_BUILD: "true"

      - name: Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: dyad-windows-installer
          path: out/make/**/*.exe

      - name: Create GitHub Release and upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: Dyad Windows ${{ github.event.inputs.tag }}
          files: out/make/**/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
